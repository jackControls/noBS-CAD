[package]
name = "nbcad"
default-run = "nbcad"
version = "0.2.2"
edition = "2021"
description = "noBS CAD native Bevy desktop"
license = "LGPL-2.1-or-later"
repository = "https://github.com/jackControls/Limo-CAD"

# The src-tauri crate is its own workspace so `cargo test` at the repo root
# stays engine-only; engine crates are shared by path dependency.
[workspace]

[lib]
name = "nbcad_lib"
crate-type = ["rlib"]

[features]
default = []
# Optional lab and bounded native IME diagnostics; the product host is always Bevy.
dev-ui-lab = ["bevy/bevy_log"]
dev-native-ime-trace = ["bevy/bevy_log"]

[[bin]]
name = "bevy-ui-lab"
path = "src/bin/bevy_ui_lab.rs"
required-features = ["dev-ui-lab"]

[build-dependencies]
winresource = "=0.1.31"

[dependencies]
nbcad-build-info = { path = "../crates/build-info" }
time = { version = "=0.3.55", features = ["formatting"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
dirs = "7.0.0"
# Native inactive-tab retention needs the portable physical-memory probe.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
base64 = "0.23.1"
# Render shared vector glyphs; native printing also resolves shared drawing text.
# External image loading remains disabled in the print SVG parser.
# svg2pdf 0.13 consumes this usvg tree directly; upgrade the SVG/PDF family together.
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts"] }
uuid = { version = "1.26.1", features = ["v4"] }
nbcad-core = { path = "../crates/core" }
nbcad-interface = { path = "../crates/interface" }
nbcad-project-file = { path = "../crates/project-file" }
nbcad-cam = { path = "../crates/cam" }
nbcad-sketch = { path = "../crates/sketch" }
nbcad-solid = { path = "../crates/solid" }
nbcad-export = { path = "../crates/export" }
nbcad-occt = { path = "../crates/occt", features = ["native-occt"] }
nbcad-native-engine = { path = "../crates/native-engine", features = ["native-occt"] }
nbcad-mcp-mutate = { path = "../crates/mcp-mutate" }
nbcad-mcp = { path = "../mcp-server" }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
bevy = { version = "=0.20.0-rc.2", default-features = false, features = [
  "bevy_winit",
  "bevy_input_focus",
  # Shared text-input guards and candidate probes need widgets, not Feathers.
  "bevy_ui_widgets",
  "ui_picking",
  "custom_cursor",
  "system_clipboard",
  "complex_script_segmentation",
  "x11",
  "wayland",
  "accesskit_unix",
  "async_executor",
  "bevy_asset",
  "bevy_camera",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_gizmos",
  "bevy_gizmos_render",
  "bevy_image",
  "bevy_light",
  "bevy_material",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_render",
  "bevy_shader",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_window",
  "default_font",
  "hdr",
  "multi_threaded",
  "png",
  "std",
  "tonemapping_luts",
  "zstd_rust",
] }
# Bevy's derives expand to these crate paths even when their types come from
# bevy::prelude; keep the direct dependencies required by generated code.
bevy_ecs = "=0.20.0-rc.2"
bevy_gizmos = "=0.20.0-rc.2"
bevy_reflect = "=0.20.0-rc.2"
raw-window-handle = "0.6.2"
# These nodes/actions cross Bevy's AccessKit 0.24 boundary.
accesskit = { version = "=0.24.1" }
# Prepared drawing pages become PDF bytes on every desktop. Windows uses that
# file when no printer is installed; Linux and macOS already spool the same bytes.
svg2pdf = { version = "=0.13.0", default-features = false, features = ["text"] }
winit = { version = "=0.30.13", default-features = false }
# RFD 0.17 drives portal requests itself; xdg-portal enables its pollster bridge.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Only the Linux print portal creates a Tokio runtime.
tokio = { version = "1.53.1", features = ["time", "rt"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "print", "raw_handle", "wayland"] }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-pdf-kit = { version = "=0.3.2", default-features = false, features = ["std", "PDFDocument", "objc2-app-kit"] }
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSApplication", "NSPrintOperation", "NSPrintInfo", "NSPrinter", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services", "NSString", "NSGeometry", "NSData"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
# Keep gpu-allocator and wgpu-hal on the same Direct3D COM types. Version 0.62.0
# is the exact intersection of gpu-allocator's `<=0.62` cap and wgpu-hal's
# `^0.62` requirement; allowing a newer patch release makes Cargo split them.
windows = { version = "=0.62.0", default-features = false, features = ["Win32_System_Registry", "Win32_Security", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_System_Memory", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging"] }
