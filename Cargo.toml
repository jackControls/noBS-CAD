# noBS CAD engine workspace. The host-neutral crates own document and
# history semantics; `crates/occt` is the native B-rep adapter (D1/D8).
# The Tauri shell in src-tauri/ is intentionally its own workspace so that
# `cargo test` at the repo root only builds/tests the engine crates.

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/sketch",
    "crates/solid",
    "crates/occt",
    "crates/wasm",
    "crates/bevy_viewport",
    "crates/bevy_launcher",
]

# Slim wasm release for the Bevy experimental shell (launcher uses --profile wasm-release).
[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "s"
strip = true
