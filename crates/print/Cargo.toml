[package]
name = "nbcad-print"
version.workspace = true
edition = "2021"
license = "LGPL-2.1-or-later"
description = "Read scanned 2D prints of plates for agents: outline calibration, millimetre crops with a grid and hole overlay, ring scores at model holes, hole-symbol detection with coverage matching"

[dependencies]
png = "0.17"
serde_json = { version = "1", features = ["float_roundtrip"] }
