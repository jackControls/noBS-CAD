[package]
name = "nbcad-help"
version.workspace = true
edition.workspace = true
license = "LGPL-2.1-or-later"
description = "Shared help catalog and BM25 search for MCP cad_help and desktop Help"
repository.workspace = true

[[bin]]
name = "nbcad-help"
path = "src/bin/nbcad-help.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
