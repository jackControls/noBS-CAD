<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>noBS CAD — Bevy experimental (wasm)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #02050a;
        color: #e8eaed;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #status {
        position: absolute;
        top: 10px;
        left: 14px;
        font-size: 13px;
        opacity: 0.9;
        pointer-events: none;
        text-shadow: 0 1px 4px #000;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading Bevy experimental wasm…</div>
    <script type="module">
      import init from "./bevy_desktop.js";
      const status = document.getElementById("status");
      try {
        await init();
        status.textContent =
          "Experimental wasm live · 1/2/3 modes · scroll=load in Simulate · Space=pause";
      } catch (error) {
        status.textContent = "Failed to start: " + error;
        console.error(error);
      }
    </script>
  </body>
</html>
