[package]
name = "nbcad-bevy-viewport"
version = "0.1.0"
edition = "2021"
description = "Spike: Bevy 0.19 display/ECS viewport (not B-rep). Issue #20 / ADR 0002."
license = "LGPL-2.0-or-later"
repository = "https://github.com/jackControls/noBS-CAD"
publish = false

[[bin]]
name = "bevy_desktop"
path = "src/bin/bevy_desktop.rs"

[dependencies]
# Lean feature set: 3d + ui + Feathers. No audio (default profile includes it).
bevy = { version = "0.19.0", default-features = false, features = [
    "3d",
    "ui",
    "bevy_feathers",
] }

[features]
default = []
# Documented for wasm builds; Bevy enables web APIs via target cfg / default_platform.
webgl2 = []
