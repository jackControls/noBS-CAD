[package]
name = "nbcad-agent-board"
version.workspace = true
edition = "2021"
license = "LGPL-2.1-or-later"
description = "Durable NATS notices and acknowledgments for collaborating agents"
publish = false

[dependencies]
anyhow = "1.0"
async-nats = { version = "0.50.0", default-features = false, features = ["kv", "nkeys", "ring"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["macros", "rt", "signal", "time"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
