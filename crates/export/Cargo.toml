[package]
name = "nbcad-export"
version.workspace = true
edition = "2021"
description = "noBS CAD manufacturing mesh writers (STL, 3MF)"
license = "LGPL-2.1-or-later"
repository.workspace = true

[dependencies]
nbcad-core = { path = "../core" }
nbcad-solid = { path = "../solid" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
