[package]
name = "nbcad-export"
version.workspace = true
edition = "2021"
description = "noBS CAD manufacturing mesh writers (STL, 3MF)"
license = "LGPL-2.1-or-later"
repository = "https://github.com/jackControls/Limo-CAD"

[dependencies]
roxmltree = { version = "0.21", optional = true }
nbcad-core = { path = "../core" }
nbcad-solid = { path = "../solid" }
nbcad-assembly = { path = "../assembly" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
roxmltree = "0.21"

[features]
test-utils = ["dep:roxmltree"]
