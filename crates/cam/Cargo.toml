[package]
name = "nbcad-cam"
version = "0.1.0"
edition = "2021"
description = "Host-neutral 3-axis CAM job model, toolpath planner, and post boundary for noBS CAD"
license = "LGPL-2.0-or-later"
repository = "https://github.com/jackControls/noBS-CAD"

[dependencies]
nbcad-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
# Native edits round-trip the whole CAM document, including f32-derived mesh
# coordinates stored as f64. One-ULP parser drift falsely stales untouched paths.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
