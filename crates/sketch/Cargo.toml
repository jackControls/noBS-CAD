[package]
name = "nbcad-sketch"
version = "0.1.0"
edition = "2021"
description = "noBS CAD 2D sketch model: entities, constraints, solver API (pure Rust, no OCCT)"
license = "LGPL-2.0-or-later"
repository = "https://github.com/jackControls/noBS-CAD"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nbcad-core = { path = "../core" }
nbcad-assembly = { path = "../assembly" }
nbcad-solid = { path = "../solid" }

[dev-dependencies]
