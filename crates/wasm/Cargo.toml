[package]
name = "nbcad-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen facade over the noBS CAD engine crates"
license = "LGPL-2.0-or-later"
repository = "https://github.com/jackControls/noBS-CAD"

[lib]
crate-type = ["cdylib", "rlib"]

# Current stable Rust emits bulk-memory and non-trapping float-to-int
# instructions for this target. Keep the release optimizer enabled while
# telling Binaryen to validate both standard WebAssembly features.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
]

[dependencies]
wasm-bindgen = "0.2"
nbcad-core = { path = "../core" }
nbcad-sketch = { path = "../sketch" }
nbcad-solid = { path = "../solid" }
