[package]
name = "nbcad-project-file"
version.workspace = true
edition.workspace = true
description = "Host-neutral noBS CAD project archives and atomic file I/O"
license = "LGPL-2.1-or-later"
repository.workspace = true
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zip = { workspace = true, features = ["deflate"] }

[dev-dependencies]
# Only the opaque-metadata rejection fixture writes an unregistered ZIP field.
zip = { workspace = true, features = ["unreserved"] }
