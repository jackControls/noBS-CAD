name: pages-knowledge
on:
  push:
    branches: [main]
    paths:
      - "knowledge/**"
      - ".github/workflows/pages-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-knowledge
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static knowledge site
        run: |
          mkdir -p _site
          cp -R knowledge/* _site/
          cp _site/home.html _site/index.html
          test -f _site/index.md
          test -f _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
