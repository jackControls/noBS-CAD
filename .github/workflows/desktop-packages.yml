name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      macos_signing:
        description: macOS signing mode
        required: true
        default: diagnostic
        type: choice
        options:
          - diagnostic
          - production
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify_changes:
    name: Classify desktop build inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows_should_build: ${{ steps.classify.outputs.windows_should_build }}
      macos_should_build: ${{ steps.classify.outputs.macos_should_build }}
    steps:
      - name: Inspect changed paths
        id: classify
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.info(`${context.eventName} runs always build both desktop packages.`);
              core.setOutput("windows_should_build", "true");
              core.setOutput("macos_should_build", "true");
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
            );

            const commonBuildInputs = [
              {
                pattern: /^(src|src-tauri|crates|public)\//,
                reason: "application or native source",
              },
              {
                pattern: /^\.github\/actions\//,
                reason: "shared GitHub Action",
              },
              {
                pattern: /^\.github\/workflows\/desktop-packages\.yml$/,
                reason: "desktop packaging workflow",
              },
              {
                pattern:
                  /^(Cargo\.toml|Cargo\.lock|package\.json|package-lock\.json|vcpkg\.json|index\.html|tsconfig\.json|vite\.config\.ts|postcss\.config\.js|tailwind\.config\.js|\.npmrc|rust-toolchain(?:\.toml)?)$/,
                reason: "build or dependency configuration",
              },
              {
                pattern: /^(LICENSE|THIRD_PARTY_NOTICES\.md)$/,
                reason: "bundled legal notice",
              },
            ];

            const platformMatches = (platformInputs) =>
              files.flatMap(({ filename }) => {
                const rule = [...commonBuildInputs, ...platformInputs].find(
                  ({ pattern }) => pattern.test(filename),
                );
                return rule ? [`${filename} (${rule.reason})`] : [];
              });

            const windowsMatches = platformMatches([
              {
                pattern: /^scripts\/(?:bundle-windows-portable|verify-windows-viewport)\.ps1$/,
                reason: "Windows packaging script",
              },
            ]);
            const macosMatches = platformMatches([
              {
                pattern: /^scripts\/(?:bundle-macos|stage-occt-macos)\.mjs$/,
                reason: "macOS packaging script",
              },
            ]);

            const report = (platform, output, matches) => {
              const shouldBuild = matches.length > 0;
              core.setOutput(output, String(shouldBuild));
              if (shouldBuild) {
                core.info(`${platform} build required by:\n${matches.join("\n")}`);
              } else {
                core.info(
                  `Skipping ${platform} build; none of ${files.length} changed files affect that packaged application.`,
                );
              }
            };

            report("Windows", "windows_should_build", windowsMatches);
            report("macOS", "macos_should_build", macosMatches);

  build-windows-portable:
    name: Windows x64 portable ZIP
    needs: classify_changes
    if: needs.classify_changes.outputs.windows_should_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      # Pull-request/manual packages retain symbols for diagnostics. A v* tag
      # is the production boundary and must ship a stripped Rust executable.
      CARGO_PROFILE_RELEASE_STRIP: ${{ github.ref_type == 'tag' && 'symbols' || 'none' }}
      VCPKG_COMMIT: 716b42043743cdceabed9c8e2e6cf80ddae1e0c1
      VCPKG_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg\archives
      VCPKG_INSTALL_ROOT: ${{ github.workspace }}\vcpkg_installed
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.cache\vcpkg\archives,readwrite

    steps:
      - name: Check out noBS CAD
        uses: actions/checkout@v4

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg
          fetch-depth: 0

      - name: Detect MSVC toolset
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationRoot = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ([string]::IsNullOrWhiteSpace($installationRoot)) {
            throw "Visual Studio C++ Build Tools were not found"
          }
          $versionFile = Join-Path `
            $installationRoot `
            "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
          if (-not (Test-Path $versionFile -PathType Leaf)) {
            throw "MSVC toolset version file was not found: $versionFile"
          }
          $toolset = (Get-Content $versionFile -Raw).Trim()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "toolset=$toolset"
          Write-Host "MSVC toolset: $toolset"

      # The completed manifest tree is substantially faster to restore than
      # asking vcpkg to reconstruct it from individual binary archives. Keep
      # the archive cache below as the fallback that seeds this cache.
      - name: Restore installed OpenCASCADE tree
        id: vcpkg-installed-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_INSTALL_ROOT }}
          key: vcpkg-installed-v1-windows-2025-x64-windows-msvc-${{ steps.msvc.outputs.toolset }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Restore vcpkg binary cache
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        id: vcpkg-binary-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-binary-v2-windows-2025-x64-windows-msvc-${{ steps.msvc.outputs.toolset }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Report OpenCASCADE cache source
        shell: pwsh
        run: |
          $installedTreeHit = "${{ steps.vcpkg-installed-cache.outputs.cache-hit }}" -eq "true"
          $source = if ($installedTreeHit) {
            "complete installed-tree cache"
          } else {
            "binary archive fallback; this run will seed the installed-tree cache"
          }
          Write-Host "OpenCASCADE dependency source: $source"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows dependency cache"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "OpenCASCADE source: **$source**."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust targets
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustup target add wasm32-unknown-unknown

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Path $env:VCPKG_BINARY_CACHE `
            -Force |
            Out-Null
          & .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed with exit code $LASTEXITCODE"
          }

      - name: Install pinned OpenCASCADE 7.9.3
        shell: pwsh
        run: |
          & .\.vcpkg\vcpkg.exe install `
            --triplet x64-windows `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --x-install-root="$env:VCPKG_INSTALL_ROOT"
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install failed with exit code $LASTEXITCODE"
          }

      # Save immediately: a cold OCCT build can consume most of the job budget,
      # so waiting for post-job cleanup risks losing the compiled package cache.
      - name: Save vcpkg binary cache
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true' && steps.vcpkg-binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-binary-v2-windows-2025-x64-windows-msvc-${{ steps.msvc.outputs.toolset }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Save installed OpenCASCADE tree
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_INSTALL_ROOT }}
          key: vcpkg-installed-v1-windows-2025-x64-windows-msvc-${{ steps.msvc.outputs.toolset }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Build portable ZIP
        shell: pwsh
        env:
          OCCT_ROOT: ${{ env.VCPKG_INSTALL_ROOT }}\x64-windows
        run: npm run bundle:windows:portable

      - name: Verify packaged native viewport
        shell: pwsh
        run: |
          $package = Get-ChildItem `
            "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\portable" `
            -Directory |
            Select-Object -First 1
          if (-not $package) {
            throw "Portable package directory was not created"
          }
          & .\scripts\verify-windows-viewport.ps1 `
            -PackageDirectory $package.FullName `
            -DiagnosticsDirectory "$env:RUNNER_TEMP\nbcad-viewport-diagnostics"

      - name: Upload Windows viewport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noBS-CAD-windows-viewport-diagnostics
          path: ${{ runner.temp }}\nbcad-viewport-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Upload portable release
        uses: actions/upload-artifact@v4
        with:
          name: noBS-CAD-0.1.0-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/portable/*.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/portable/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-macos-apple-silicon:
    name: macOS Apple silicon DMG
    needs: classify_changes
    if: needs.classify_changes.outputs.macos_should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # Tags are always production builds. A manual production run is the
      # credential/notarization dry-run path before creating a release tag.
      MACOS_DISTRIBUTION_BUILD: >-
        ${{ github.ref_type == 'tag' ||
            (github.event_name == 'workflow_dispatch' && inputs.macos_signing == 'production') }}
      CARGO_PROFILE_RELEASE_STRIP: >-
        ${{ (github.ref_type == 'tag' ||
             (github.event_name == 'workflow_dispatch' && inputs.macos_signing == 'production')) &&
            'symbols' || 'none' }}

    steps:
      - name: Check out noBS CAD
        uses: actions/checkout@v4

      - name: Verify Apple silicon runner
        shell: bash
        run: |
          architecture="$(uname -m)"
          if [[ "$architecture" != "arm64" ]]; then
            echo "Expected an Apple silicon runner, got $architecture" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust targets
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustup target add wasm32-unknown-unknown

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Install pinned OpenCASCADE 7.9.3
        shell: bash
        run: |
          brew install opencascade
          occt_version="$(brew list --versions opencascade | awk '{ print $2 }')"
          if [[ "$occt_version" != "7.9.3" ]]; then
            echo "Expected OpenCASCADE 7.9.3, got $occt_version" >&2
            exit 1
          fi
          echo "OCCT_ROOT=$(brew --prefix opencascade)" >> "$GITHUB_ENV"

      - name: Import Developer ID Application certificate
        if: env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?Missing APPLE_CERTIFICATE repository secret}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD repository secret}"

          certificate_path="$RUNNER_TEMP/nbcad-signing-certificate.p12"
          keychain_path="$RUNNER_TEMP/nbcad-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE" |
            openssl base64 -d -A > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          security default-keychain -d user -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              sed -nE 's/^[[:space:]]*[0-9]+\) [[:xdigit:]]+ "(Developer ID Application: .+)"$/\1/p' |
              sed -n '1p'
          )"
          if [[ -z "$signing_identity" ]]; then
            security find-identity -v -p codesigning "$keychain_path"
            echo "The imported archive does not contain a valid Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "Imported production signing identity: $signing_identity"

      - name: Prepare App Store Connect notarization key
        if: env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER repository secret}"
          : "${APPLE_API_KEY:?Missing APPLE_API_KEY repository secret}"
          : "${APPLE_API_PRIVATE_KEY:?Missing APPLE_API_PRIVATE_KEY repository secret}"

          api_key_path="$RUNNER_TEMP/nbcad-notary-api-key.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          if ! grep -q '^-----BEGIN PRIVATE KEY-----$' "$api_key_path"; then
            echo "APPLE_API_PRIVATE_KEY is not an App Store Connect .p8 private key." >&2
            exit 1
          fi

      - name: Build ad-hoc signed DMG
        if: env.MACOS_DISTRIBUTION_BUILD != 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run bundle:macos

      - name: Build Developer ID signed and notarized DMG
        if: env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/nbcad-notary-api-key.p8
        run: npm run bundle:macos

      - name: Verify Developer ID signature and notarization ticket
        if: env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/noBS CAD.app"
          signature_details="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Authority=Developer ID Application:' <<< "$signature_details"; then
            echo "$signature_details"
            echo "Production app is not signed by a Developer ID Application identity." >&2
            exit 1
          fi
          team_id="$(sed -n 's/^TeamIdentifier=//p' <<< "$signature_details")"
          if [[ -z "$team_id" || "$team_id" == "not set" ]]; then
            echo "$signature_details"
            echo "Production signature has no Apple Team ID." >&2
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Verify packaged architecture and launch
        shell: bash
        run: |
          app="src-tauri/target/release/bundle/macos/noBS CAD.app"
          executable="$app/Contents/MacOS/nbcad"
          if ! lipo -archs "$executable" | tr ' ' '\n' | grep -qx arm64; then
            echo "Packaged executable is not Apple silicon:" >&2
            lipo -info "$executable" >&2
            exit 1
          fi

          log="$RUNNER_TEMP/nbcad-macos-smoke.log"
          "$executable" >"$log" 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0
            wait "$pid" || status=$?
            cat "$log"
            echo "Packaged application exited during launch smoke test (code $status)" >&2
            if [[ "$status" -eq 0 ]]; then
              status=1
            fi
            exit "$status"
          fi
          kill "$pid"
          wait "$pid" || true
          cat "$log"

      - name: Create checksum
        shell: bash
        run: |
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "DMG was not created" >&2
            exit 1
          fi
          dmg_directory="$(dirname "$dmg")"
          dmg_name="$(basename "$dmg")"
          (
            cd "$dmg_directory"
            shasum -a 256 "$dmg_name" > "$dmg_name.sha256"
          )

      - name: Upload Apple silicon release
        uses: actions/upload-artifact@v4
        with:
          name: noBS-CAD-0.1.0-macos-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove Apple signing credentials
        if: always() && env.MACOS_DISTRIBUTION_BUILD == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/nbcad-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/nbcad-signing-certificate.p12" \
            "$RUNNER_TEMP/nbcad-notary-api-key.p8"
