name: MCP server

on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'crates/core/**'
      - 'crates/sketch/**'
      - 'crates/solid/**'
      - 'crates/occt/**'
      - 'crates/export/**'
      - 'xtask/**'
      - 'vcpkg.json'
      - '.github/workflows/mcp-server.yml'
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'crates/core/**'
      - 'crates/sketch/**'
      - 'crates/solid/**'
      - 'crates/occt/**'
      - 'crates/export/**'
      - 'xtask/**'
      - 'vcpkg.json'
      - '.github/workflows/mcp-server.yml'

env:
  CARGO_TERM_COLOR: always
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg/archives,readwrite

jobs:
  mcp-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 716b42043743cdceabed9c8e2e6cf80ddae1e0c1
          path: .vcpkg
          # Shallow clones break versioned port tree objects (opencascade).
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust formatting
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt check failed" }

      - name: MSVC environment
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$installPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64'
          $toolset = "msvc"
          "toolset=$toolset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INCLUDE=$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIB=$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBPATH=$env:LIBPATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-binary-mcp-v1-${{ steps.msvc.outputs.toolset }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }

      - name: Install OCCT via vcpkg
        shell: pwsh
        run: |
          & .\.vcpkg\vcpkg.exe install `
            --triplet x64-windows `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --x-install-root="$env:GITHUB_WORKSPACE\vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: MCP server tests
        shell: pwsh
        env:
          OCCT_ROOT: ${{ github.workspace }}\vcpkg_installed\x64-windows
        run: |
          $env:Path = "$env:OCCT_ROOT\bin;$env:Path"
          cargo test --manifest-path mcp-server/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "mcp-server tests failed" }

      - name: Export crate tests
        shell: pwsh
        run: |
          cargo test --locked -p nbcad-export
          if ($LASTEXITCODE -ne 0) { throw "nbcad-export tests failed" }

      - name: xtask install-mcp tests
        shell: pwsh
        run: |
          cargo test --locked -p xtask
          if ($LASTEXITCODE -ne 0) { throw "xtask tests failed" }

  # Linux MCP tests use Ubuntu 26.04 apt OCCT 7.9 (same SDK contract as
  # desktop-packages / scripts/docker/ubuntu-26.04.Dockerfile). Host-neutral
  # linux-engine-tests stay on ubuntu-24.04 because they do not link OCCT.
  mcp-tests-linux:
    name: MCP tests (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenCASCADE 7.9 SDK (Ubuntu packages)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            libocct-data-exchange-7.9 \
            libocct-foundation-dev \
            libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev \
            ninja-build

          # Ubuntu's STEP development package recommends the VTK/IVTK SDK,
          # which noBS CAD does not use. Extract its headers after installing
          # the exact OCCT runtime and lower-level development libraries.
          pushd "$RUNNER_TEMP"
          apt-get download libocct-data-exchange-dev
          package="$(find . -maxdepth 1 -name 'libocct-data-exchange-dev_*.deb' -print -quit)"
          test -n "$package"
          sudo dpkg-deb --extract "$package" /
          popd

      - name: MCP server tests
        shell: bash
        # build.rs probes /usr when OCCT_ROOT is unset; set it explicitly.
        env:
          OCCT_ROOT: /usr
        run: cargo test --manifest-path mcp-server/Cargo.toml
