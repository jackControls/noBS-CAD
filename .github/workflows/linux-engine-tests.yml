name: Linux engine tests

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'knowledge/**'
      - 'examples/scripts/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/actions/setup-rust/**'
      - '.github/workflows/linux-engine-tests.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'knowledge/**'
      - 'examples/scripts/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/actions/setup-rust/**'
      - '.github/workflows/linux-engine-tests.yml'

permissions:
  contents: read

concurrency:
  group: linux-engine-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine-tests:
    name: Ubuntu host-neutral crates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out noBS CAD
        uses: actions/checkout@v4

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2

      - name: Install fonts for actual Unicode drawing export
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends fonts-noto-core fonts-noto-cjk

      - name: Test complete host-neutral workspace
        run: cargo test --locked --workspace
