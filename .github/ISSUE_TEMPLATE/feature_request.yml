name: Feature / proposal
description: Enhancement or product proposal
title: "[feat] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - sketch
        - modeling
        - CAM
        - import/export
        - MCP/automation
        - simulation
        - UI/viewport
        - packaging
        - documentation
        - other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked and why
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist for a PR to close this issue
    validations:
      required: true
