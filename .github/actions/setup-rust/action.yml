name: Repository Rust toolchain
description: Use rust-toolchain.toml for the compiler, rustfmt, Clippy and target installation
inputs:
  directory:
    description: Checkout containing rust-toolchain.toml
    default: '.'
  target:
    description: Optional additional Rust target triple
    default: ''
outputs:
  toolchain:
    description: Active pinned compiler, including host triple
    value: ${{ steps.rust.outputs.toolchain }}
runs:
  using: composite
  steps:
    # rustup reads the checked-out rust-toolchain.toml before Cargo can run.
    # This thin bootstrap also works on Windows GitHub runners with Bash.
    - name: Install repository toolchain
      id: rust
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        NBCAD_RUST_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        rustup show
        nbcad_toolchain="$(rustup show active-toolchain)"
        echo "toolchain=${nbcad_toolchain%% *}" >> "$GITHUB_OUTPUT"
        if [[ -n "$NBCAD_RUST_TARGET" ]]; then
          rustup target add "$NBCAD_RUST_TARGET"
        fi
