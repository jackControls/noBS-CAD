name: Ubuntu desktop SDK
description: Shared Ubuntu 26.04 OCCT, desktop, and packaging dependencies
inputs:
  desktop-input:
    description: Install disposable-desktop keyboard, clipboard, font, and IME tools
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install Ubuntu 26.04 desktop and OpenCASCADE SDK
      shell: bash
      env:
        DESKTOP_INPUT: ${{ inputs.desktop-input }}
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          build-essential ca-certificates clang cmake dbus-x11 desktop-file-utils file libdbus-1-3 \
          fonts-noto-core fonts-noto-cjk \
          libfuse2t64 \
          libocct-data-exchange-7.9 libocct-foundation-dev \
          libocct-modeling-algorithms-dev libocct-modeling-data-dev \
          libudev-dev libvulkan-dev libwayland-dev \
          libx11-dev libx11-xcb1 libxcursor1 libxi6 libxkbcommon-dev libxkbcommon-x11-dev \
          mesa-vulkan-drivers ninja-build patchelf pkg-config vulkan-tools weston \
          xauth xdg-utils xdg-desktop-portal xdg-desktop-portal-gtk xwayland xvfb zenity
        if [[ "$DESKTOP_INPUT" == true ]]; then
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-color-emoji \
            ibus ibus-libpinyin imagemagick xclip xdotool
        fi
        # Ubuntu's STEP -dev package pulls the unused VTK/IVTK SDK. Install
        # matching runtime/lower SDKs normally and extract only STEP headers.
        sdk_headers="$(mktemp -d "$RUNNER_TEMP/nbcad-occt-headers.XXXXXX")"
        (
          cd "$sdk_headers"
          apt-get download libocct-data-exchange-dev
          package="$(find . -maxdepth 1 -name 'libocct-data-exchange-dev_*.deb' -print -quit)"
          test -n "$package"
          sudo dpkg-deb --extract "$package" /
        )
