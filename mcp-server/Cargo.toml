[package]
name = "nbcad-mcp"
version = "0.2.2"
edition = "2021"
description = "Headless MCP stdio server for noBS CAD sketch and solid tools"
license = "LGPL-2.1-or-later"
repository = "https://github.com/jackControls/Limo-CAD"

# Keep native OCCT out of the host-neutral root workspace.
[workspace]

[dependencies]
nbcad-build-info = { path = "../crates/build-info" }
nbcad-interface = { path = "../crates/interface" }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
nbcad-script = { path = "../crates/script" }
nbcad-recipes = { path = "../crates/recipes" }
nbcad-help = { path = "../crates/help" }
nbcad-core = { path = "../crates/core" }
nbcad-sketch = { path = "../crates/sketch" }
nbcad-solid = { path = "../crates/solid" }
nbcad-export = { path = "../crates/export" }
nbcad-occt = { path = "../crates/occt", features = ["native-occt"] }
nbcad-mcp-mutate = { path = "../crates/mcp-mutate" }
nbcad-print = { path = "../crates/print" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Pipes"] }

[dev-dependencies]
jsonschema = { version = "0.58.4", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
