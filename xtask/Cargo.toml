[package]
name = "xtask"
version.workspace = true
edition.workspace = true
description = "Repo maintenance tasks (MCP client install, etc.)"
license = "LGPL-2.1-or-later"
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
regex.workspace = true
semver.workspace = true
tempfile.workspace = true
toml_edit.workspace = true
sha2.workspace = true
zip = { workspace = true, features = ["deflate"] }
ureq.workspace = true
time = { workspace = true, features = ["parsing"] }
tar.workspace = true
flate2 = { workspace = true, features = ["rust_backend"] }
sysinfo = { workspace = true, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }
